name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` runs typecheck (tsc across app/electron/cli configs),
      # the electron + cli tsc builds, and `vite build`.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
